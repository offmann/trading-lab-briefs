name: Rebuild Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/rebuild-pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/rebuild-pages.yml"
  workflow_dispatch:

concurrency:
  group: rebuild-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild gallery and scrub
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/rebuild_gallery.py --check
            python3 scripts/rebuild_gallery.py
          else
            python3 scripts/rebuild_gallery.py --strip
          fi

      - name: Commit hub updates
        if: github.event_name != 'pull_request'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No gallery changes"
            exit 0
          fi
          git commit -m "Rebuild public gallery from briefs"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages build
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.request("POST /repos/{owner}/{repo}/pages/builds", {
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.info("Requested GitHub Pages build");
            } catch (err) {
              core.warning(`Pages build request skipped: ${err.message}`);
            }
